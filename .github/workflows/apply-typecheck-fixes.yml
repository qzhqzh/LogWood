name: Apply typecheck fixes

on:
  push:
    branches:
      - agent/review-upload-ci-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/review-upload-ci-hardening

      - name: Apply reviewed minimal fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {actual}')
              file.write_text(text.replace(old, new))

          replace(
              'src/lib/logger.test.ts',
              "const ORIGINAL_LEVEL = process.env.LOG_LEVEL\nconst ORIGINAL_NODE_ENV = process.env.NODE_ENV\n",
              "const ORIGINAL_LEVEL = process.env.LOG_LEVEL\n",
          )
          replace(
              'src/lib/logger.test.ts',
              "  if (ORIGINAL_LEVEL === undefined) delete process.env.LOG_LEVEL\n  else process.env.LOG_LEVEL = ORIGINAL_LEVEL\n  if (ORIGINAL_NODE_ENV === undefined) delete process.env.NODE_ENV\n  else process.env.NODE_ENV = ORIGINAL_NODE_ENV\n",
              "  if (ORIGINAL_LEVEL === undefined) delete process.env.LOG_LEVEL\n  else process.env.LOG_LEVEL = ORIGINAL_LEVEL\n",
          )

          replace(
              'src/modules/evaluation/service.ts',
              'evidence as Prisma.InputJsonValue',
              'evidence as unknown as Prisma.InputJsonValue',
              expected=2,
          )

          replace(
              'src/modules/moderation/service.test.ts',
              "import { ReportStatus, ReportTargetType, CommentStatus, ArticleStatus } from '@prisma/client'",
              "import { ActorType, ReportStatus, ReportTargetType, CommentStatus, ArticleStatus } from '@prisma/client'",
          )
          replace(
              'src/modules/moderation/service.test.ts',
              "      { userId: 'u1' }",
              "      { actorType: ActorType.user, actorKey: 'user:u1', userId: 'u1' }",
          )

          replace(
              'src/modules/review/service.test.ts',
              "import { ReviewStatus } from '@prisma/client'",
              "import { ActorType, ReviewStatus } from '@prisma/client'",
          )
          replace(
              'src/modules/review/service.test.ts',
              "        { userId: 'u1' }",
              "        { actorType: ActorType.user, actorKey: 'user:u1', userId: 'u1' }",
              expected=2,
          )
          replace(
              'src/modules/review/service.test.ts',
              "      { anonymousUserId: 'au1' }",
              "      {\n        actorType: ActorType.anonymous,\n        actorKey: 'anonymous:au1',\n        anonymousUserId: 'au1',\n      }",
          )

          replace(
              'src/modules/target/service.ts',
              "    if (typeof group._avg.rating === 'number') {",
              "    if (group.targetId && typeof group._avg.rating === 'number') {",
              expected=2,
          )

      - name: Commit fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/logger.test.ts src/modules/evaluation/service.ts src/modules/moderation/service.test.ts src/modules/review/service.test.ts src/modules/target/service.ts
          git commit -m "fix: resolve strict TypeScript errors"
          git push origin HEAD:agent/review-upload-ci-hardening
